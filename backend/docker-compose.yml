services:
  postgres:
    image: postgres
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aATHIF123#
#      POSTGRES_DB: user-service-management
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  service-registry:
    build:
      context: ./service-registry
    image: service-registry-image
    container_name: service-registry
    restart: always
    ports:
      - "8761:8761"
    depends_on:
      - postgres

  api-gateway:
    build:
      context: ./api-geteway
    image: api-gateway-image
    container_name: api-gateway
    restart: always
    ports:
      - "8765:8765"
#      - "4000:4000"
    depends_on:
      - service-registry

  user-service:
    build:
      context: ./user-service
    image: user-service-image
    container_name: user-service
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - service-registry

  learner-service:
    build:
      context: ./learner-service
    image: learner-service-image
    container_name: learner-service
    restart: always
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - service-registry

  instructor-service:
    build:
      context: ./instructor-service
    image: instructor-service-image
    container_name: instructor-service
    restart: always
    ports:
      - "8098:8098"
    depends_on:
      - postgres
      - service-registry

  course-service:
    build:
      context: ./course-service
    image: course-service-image
    container_name: course-service
    restart: always
    ports:
      - "8091:8091"
    depends_on:
      - postgres
      - service-registry

  finance-service:
    build:
      context: ./finance-service
    image: finance-service-image
    container_name: finance-service
    restart: always
    ports:
      - "8092:8092"
    depends_on:
      - postgres
      - service-registry

volumes:
  postgres-data:





